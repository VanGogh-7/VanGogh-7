      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.64" stop-color="#101720"/>
      <stop offset="1" stop-color="#121827"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="998" height="258" rx="16" fill="url(#wash)" stroke="#30363d" stroke-width="2"/>
  <rect x="594" y="1" width="405" height="258" rx="15" fill="url(#grid)"/>
  <path d="M1 16A15 15 0 0 1 16 1H984A15 15 0 0 1 999 16V20H1Z" fill="#58a6ff" opacity="0.72"/>

