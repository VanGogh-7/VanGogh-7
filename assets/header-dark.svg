<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title description">
  <title id="title">Orion Van Gogh — Mathematics, Artificial Intelligence, and Systems</title>
  <desc id="description">A midnight-blue research banner with mathematical notation and a small agent runtime graph.</desc>
  <defs>
