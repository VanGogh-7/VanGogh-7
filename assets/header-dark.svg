  <text x="56" y="102" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="650" letter-spacing="1.2">ORION VAN GOGH</text>
  <text x="58" y="135" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17">Mathematics · Artificial Intelligence · Systems</text>
  <text x="58" y="164" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">Structures behind mathematics and intelligent systems.</text>

